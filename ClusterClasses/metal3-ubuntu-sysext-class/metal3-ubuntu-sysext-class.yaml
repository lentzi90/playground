apiVersion: cluster.x-k8s.io/v1beta2
kind: ClusterClass
metadata:
  name: lennart-metal3-ubuntu-sysext-v0.1.0
spec:
  kubernetesVersions:
  - v1.32.13
  - v1.33.9
  - v1.34.5
  - v1.35.2
  controlPlane:
    templateRef:
      apiVersion: controlplane.cluster.x-k8s.io/v1beta2
      kind: KubeadmControlPlaneTemplate
      name: lennart-metal3-ubuntu-sysext-v0.1.0
    machineInfrastructure:
      templateRef:
        kind: Metal3MachineTemplate
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        name: lennart-metal3-ubuntu-sysext-v0.1.0
  infrastructure:
    templateRef:
      apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
      kind: Metal3ClusterTemplate
      name: lennart-metal3-ubuntu-sysext-v0.1.0
  workers:
    machineDeployments:
    - class: default-worker
      bootstrap:
        templateRef:
          apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
          kind: KubeadmConfigTemplate
          name: lennart-metal3-ubuntu-sysext-v0.1.0-default-worker
      infrastructure:
        templateRef:
          apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
          kind: Metal3MachineTemplate
          name: lennart-metal3-ubuntu-sysext-v0.1.0-default-worker

  variables:
  - name: controlPlaneEndpoint
    required: false
    schema:
      openAPIV3Schema:
        type: object
        description: "The control plane endpoint configuration"
        properties:
          host:
            type: string
            description: "The host IP address for the control plane endpoint"
            default: "192.168.222.100"
          port:
            type: integer
            description: "The port number for the control plane endpoint"
            default: 6443
  - name: imageName
    required: false
    schema:
      openAPIV3Schema:
        type: string
        description: |
          The base name of the Ubuntu disk image used for provisioning the
          servers. Unlike the standard Ubuntu class, the Kubernetes version
          is NOT baked into the image — it is delivered at boot time via a
          systemd-sysext overlay fetched from extensions.flatcar.org. The
          image only needs a base Ubuntu install with systemd 252+.
        default: "ubuntu-2404"
  - name: imageChecksum
    required: true
    schema:
      openAPIV3Schema:
        type: string
        example: aab4cbba9707d14c58931f6e9fb75736d5fe3df0f52a4e19c70609e11b5623af
        description: "The SHA256 checksum of the Ubuntu disk image."
  - name: injectKubeVip
    required: false
    schema:
      openAPIV3Schema:
        type: boolean
        description: |
          Deploy a Kube-VIP static pod on control-plane nodes to provide a
          virtual IP for the API server. Disable only if you use an external
          load balancer instead.
        default: true
  - name: users
    required: false
    schema:
      openAPIV3Schema:
        type: array
        description: "List of users to create on the nodes with their SSH keys and sudo access"
        items:
          type: object
          properties:
            name:
              type: string
            sudo:
              type: string
            sshAuthorizedKeys:
              type: array
              items:
                type: string
          required:
          - name
  - name: workerDataTemplateName
    required: false
    schema:
      openAPIV3Schema:
        type: string
        example: test-1-workers-template
        description: "The name of the Metal3DataTemplate to use for the workers."
  - name: controlPlaneDataTemplateName
    required: false
    schema:
      openAPIV3Schema:
        type: string
        example: test-1-controlplane-template
        description: "The name of the Metal3DataTemplate to use for the control plane."

  patches:
  # ---------------------------------------------------------------------------
  # Infrastructure patches
  # ---------------------------------------------------------------------------
  - name: controlPlaneEndpoint
    description: "Configure the control plane endpoint host and port"
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: Metal3ClusterTemplate
        matchResources:
          infrastructureCluster: true
      jsonPatches:
      - op: replace
        path: /spec/template/spec/controlPlaneEndpoint
        valueFrom:
          variable: controlPlaneEndpoint

  - name: image
    description: "Sets the disk image URL. No k8s version suffix — sysext provides Kubernetes."
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: Metal3MachineTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/image/url
        valueFrom:
          template: |
            http://192.168.222.1/{{ .imageName }}.raw
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: Metal3MachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
      jsonPatches:
      - op: add
        path: /spec/template/spec/image/url
        valueFrom:
          template: |
            http://192.168.222.1/{{ .imageName }}.raw

  - name: imageChecksum
    description: "Sets the image checksum from the variable."
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: Metal3MachineTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/image/checksum
        valueFrom:
          variable: imageChecksum
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: Metal3MachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
      jsonPatches:
      - op: add
        path: /spec/template/spec/image/checksum
        valueFrom:
          variable: imageChecksum

  # ---------------------------------------------------------------------------
  # Optional Metal3DataTemplate references
  # ---------------------------------------------------------------------------
  - name: controlPlaneDataTemplate
    # TODO: Properly support optional Metal3DataTemplate
    enabledIf: "false"
    description: "Sets the Metal3DataTemplate for the control plane"
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: Metal3MachineTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/dataTemplate/name
        valueFrom:
          variable: controlPlaneDataTemplateName

  - name: workerDataTemplate
    # TODO: Properly support optional Metal3DataTemplate
    enabledIf: "false"
    description: "Sets the Metal3DataTemplate for workers"
    definitions:
    - selector:
        apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
        kind: Metal3MachineTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
      jsonPatches:
      - op: add
        path: /spec/template/spec/dataTemplate/name
        valueFrom:
          variable: workerDataTemplateName

  # ---------------------------------------------------------------------------
  # Bootstrap user patch
  # ---------------------------------------------------------------------------
  - name: users
    description: "Configure the users, their SSH keys and sudo access"
    definitions:
    - selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta2
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/users
        valueFrom:
          variable: users
    - selector:
        apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
        kind: KubeadmConfigTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
      jsonPatches:
      - op: add
        path: /spec/template/spec/users
        valueFrom:
          variable: users

  # ---------------------------------------------------------------------------
  # Control plane scripts, files, and commands
  #
  # Single patch for all control-plane file and command injection to avoid
  # multiple patches writing to the same JSON path (op: add on files).
  #
  # Includes:
  #   - Sysext setup script: downloads the Kubernetes sysext image from
  #     extensions.flatcar.org, repackages it with ID=_any for Ubuntu
  #     compatibility, and activates it via systemd-sysext refresh.
  #   - Kube-VIP static pod manifest (conditional on injectKubeVip).
  #   - preKubeadmCommands / postKubeadmCommands for sysext + kube-vip.
  # ---------------------------------------------------------------------------
  - name: controlPlaneScriptsAndFiles
    description: "Add scripts, files, and commands for control plane nodes (sysext setup and/or kube-vip)."
    definitions:
    - selector:
        apiVersion: controlplane.cluster.x-k8s.io/v1beta2
        kind: KubeadmControlPlaneTemplate
        matchResources:
          controlPlane: true
      jsonPatches:
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/preKubeadmCommands
        valueFrom:
          template: |
            - KUBERNETES_VERSION={{ .builtin.controlPlane.version }} /opt/sysext/install-k8s-sysext.sh
            {{ if .injectKubeVip }}
            # See https://github.com/kube-vip/kube-vip/issues/684
            - "sed -i 's#path: /etc/kubernetes/admin.conf#path: /etc/kubernetes/super-admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml"
            {{ end }}
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/postKubeadmCommands
        valueFrom:
          template: |
            {{ if .injectKubeVip }}
            # See https://github.com/kube-vip/kube-vip/issues/684
            - "sed -i 's#path: /etc/kubernetes/super-admin.conf#path: /etc/kubernetes/admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml"
            {{ end }}
      - op: add
        path: /spec/template/spec/kubeadmConfigSpec/files
        valueFrom:
          template: |
            - path: /opt/sysext/install-k8s-sysext.sh
              owner: root:root
              permissions: '0755'
              content: |
                #!/bin/bash
                # Install Kubernetes components via systemd-sysext overlay
                # and set up containerd + required kernel/sysctl prerequisites.
                #
                # The Flatcar Kubernetes sysext provides kubeadm, kubectl, kubelet
                # but NOT containerd (which is part of Flatcar's base OS).
                # On Ubuntu we install containerd via apt separately.
                set -euo pipefail

                KUBE_VERSION="${KUBERNETES_VERSION:?KUBERNETES_VERSION must be set}"
                ARCH="x86-64"
                BASE_URL="https://extensions.flatcar.org/extensions/kubernetes"
                KUBE_MAJOR_MINOR="${KUBE_VERSION%.*}"

                echo "==> Setting up Kubernetes ${KUBE_VERSION} on Ubuntu via sysext overlay..."

                # -----------------------------------------------------------
                # Phase 1: Kernel modules and sysctl prerequisites
                # -----------------------------------------------------------
                echo "==> Loading required kernel modules..."
                modprobe overlay
                modprobe br_netfilter
                cat > /etc/modules-load.d/kubernetes.conf <<MODEOF
                overlay
                br_netfilter
                MODEOF

                echo "==> Configuring sysctl for Kubernetes networking..."
                cat > /etc/sysctl.d/99-kubernetes-cri.conf <<SYSEOF
                net.bridge.bridge-nf-call-iptables  = 1
                net.bridge.bridge-nf-call-ip6tables = 1
                net.ipv4.ip_forward                 = 1
                SYSEOF
                sysctl --system

                # -----------------------------------------------------------
                # Phase 2: Install containerd and squashfs-tools
                # -----------------------------------------------------------
                echo "==> Installing containerd and squashfs-tools..."
                apt-get update -qq
                apt-get install -y -qq containerd squashfs-tools

                echo "==> Configuring containerd with SystemdCgroup driver..."
                mkdir -p /etc/containerd
                containerd config default > /etc/containerd/config.toml
                sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
                systemctl restart containerd
                systemctl enable containerd

                # -----------------------------------------------------------
                # Phase 3: Kubernetes sysext overlay
                # -----------------------------------------------------------
                # Create directories
                mkdir -p /opt/extensions/kubernetes /etc/extensions
                mkdir -p /etc/sysupdate.kubernetes.d /etc/sysupdate.d

                # Download the Kubernetes sysext image
                echo "==> Downloading sysext image kubernetes-${KUBE_VERSION}-${ARCH}.raw ..."
                curl -fsSL -o "/tmp/kubernetes-${KUBE_VERSION}-${ARCH}.raw" \
                    "${BASE_URL}/kubernetes-${KUBE_VERSION}-${ARCH}.raw"

                # Repackage with ID=_any for Ubuntu compatibility
                echo "==> Repackaging sysext image for Ubuntu compatibility..."
                TMPDIR=$(mktemp -d)
                unsquashfs -d "${TMPDIR}/extract" "/tmp/kubernetes-${KUBE_VERSION}-${ARCH}.raw"

                RELEASE_DIR="${TMPDIR}/extract/usr/lib/extension-release.d"
                mkdir -p "${RELEASE_DIR}"
                rm -f "${RELEASE_DIR}"/extension-release.*
                echo "ID=_any" > "${RELEASE_DIR}/extension-release.kubernetes"

                mksquashfs "${TMPDIR}/extract" \
                    "/opt/extensions/kubernetes/kubernetes-${KUBE_VERSION}-${ARCH}.raw" \
                    -noappend -quiet
                rm -rf "${TMPDIR}" "/tmp/kubernetes-${KUBE_VERSION}-${ARCH}.raw"

                # Create symlink for systemd-sysext
                ln -sf "/opt/extensions/kubernetes/kubernetes-${KUBE_VERSION}-${ARCH}.raw" \
                    /etc/extensions/kubernetes.raw

                # Download sysupdate configs for future patch-level updates
                echo "==> Downloading sysupdate configs..."
                curl -fsSL -o "/etc/sysupdate.kubernetes.d/kubernetes-${KUBE_MAJOR_MINOR}.conf" \
                    "${BASE_URL}/kubernetes-${KUBE_MAJOR_MINOR}.conf" || true
                curl -fsSL -o /etc/sysupdate.d/noop.conf \
                    "https://extensions.flatcar.org/extensions/noop.conf" || true

                # Activate the sysext overlay
                echo "==> Activating sysext overlay..."
                systemd-sysext refresh

                # Reload systemd and enable kubelet (containerd already running)
                systemctl daemon-reload
                systemctl enable kubelet

                echo "==> Kubernetes ${KUBE_VERSION} sysext setup complete."
            {{ if .injectKubeVip }}
            - content: |
                apiVersion: v1
                kind: Pod
                metadata:
                  name: kube-vip
                  namespace: kube-system
                spec:
                  containers:
                  - args:
                    - manager
                    env:
                    - name: vip_arp
                      value: "true"
                    - name: port
                      value: "{{ .controlPlaneEndpoint.port }}"
                    - name: vip_nodename
                      valueFrom:
                        fieldRef:
                          fieldPath: spec.nodeName
                    - name: vip_interface
                      value: enp1s0
                    - name: vip_subnet
                      value: "32"
                    - name: dns_mode
                      value: first
                    - name: cp_enable
                      value: "true"
                    - name: cp_namespace
                      value: kube-system
                    - name: vip_leaderelection
                      value: "true"
                    - name: vip_leasename
                      value: plndr-cp-lock
                    - name: vip_leaseduration
                      value: "5"
                    - name: vip_renewdeadline
                      value: "3"
                    - name: vip_retryperiod
                      value: "1"
                    - name: address
                      value: {{ .controlPlaneEndpoint.host }}
                    - name: prometheus_server
                      value: :2112
                    image: ghcr.io/kube-vip/kube-vip:v1.0.0
                    imagePullPolicy: IfNotPresent
                    name: kube-vip
                    securityContext:
                      capabilities:
                        add:
                        - NET_ADMIN
                        - NET_RAW
                        drop:
                        - ALL
                    volumeMounts:
                    - mountPath: /etc/kubernetes/admin.conf
                      name: kubeconfig
                  hostAliases:
                  - hostnames:
                    - kubernetes
                    ip: 127.0.0.1
                  hostNetwork: true
                  volumes:
                  - hostPath:
                      path: /etc/kubernetes/admin.conf
                    name: kubeconfig
              path: /etc/kubernetes/manifests/kube-vip.yaml
              owner: root:root
              permissions: '0644'
            {{ end }}

  # ---------------------------------------------------------------------------
  # Worker scripts and files
  # ---------------------------------------------------------------------------
  - name: workerScriptsAndFiles
    description: "Add scripts and files for worker nodes."
    definitions:
    - selector:
        apiVersion: bootstrap.cluster.x-k8s.io/v1beta2
        kind: KubeadmConfigTemplate
        matchResources:
          machineDeploymentClass:
            names:
            - default-worker
      jsonPatches:
      - op: add
        path: /spec/template/spec/files
        valueFrom:
          template: |
            - path: /opt/sysext/install-k8s-sysext.sh
              owner: root:root
              permissions: '0755'
              content: |
                #!/bin/bash
                # Install Kubernetes components via systemd-sysext overlay
                # and set up containerd + required kernel/sysctl prerequisites.
                #
                # The Flatcar Kubernetes sysext provides kubeadm, kubectl, kubelet
                # but NOT containerd (which is part of Flatcar's base OS).
                # On Ubuntu we install containerd via apt separately.
                set -euo pipefail

                KUBE_VERSION="${KUBERNETES_VERSION:?KUBERNETES_VERSION must be set}"
                ARCH="x86-64"
                BASE_URL="https://extensions.flatcar.org/extensions/kubernetes"
                KUBE_MAJOR_MINOR="${KUBE_VERSION%.*}"

                echo "==> Setting up Kubernetes ${KUBE_VERSION} on Ubuntu via sysext overlay..."

                # -----------------------------------------------------------
                # Phase 1: Kernel modules and sysctl prerequisites
                # -----------------------------------------------------------
                echo "==> Loading required kernel modules..."
                modprobe overlay
                modprobe br_netfilter
                cat > /etc/modules-load.d/kubernetes.conf <<MODEOF
                overlay
                br_netfilter
                MODEOF

                echo "==> Configuring sysctl for Kubernetes networking..."
                cat > /etc/sysctl.d/99-kubernetes-cri.conf <<SYSEOF
                net.bridge.bridge-nf-call-iptables  = 1
                net.bridge.bridge-nf-call-ip6tables = 1
                net.ipv4.ip_forward                 = 1
                SYSEOF
                sysctl --system

                # -----------------------------------------------------------
                # Phase 2: Install containerd and squashfs-tools
                # -----------------------------------------------------------
                echo "==> Installing containerd and squashfs-tools..."
                apt-get update -qq
                apt-get install -y -qq containerd squashfs-tools

                echo "==> Configuring containerd with SystemdCgroup driver..."
                mkdir -p /etc/containerd
                containerd config default > /etc/containerd/config.toml
                sed -i 's/SystemdCgroup = false/SystemdCgroup = true/' /etc/containerd/config.toml
                systemctl restart containerd
                systemctl enable containerd

                # -----------------------------------------------------------
                # Phase 3: Kubernetes sysext overlay
                # -----------------------------------------------------------
                # Create directories
                mkdir -p /opt/extensions/kubernetes /etc/extensions
                mkdir -p /etc/sysupdate.kubernetes.d /etc/sysupdate.d

                # Download the Kubernetes sysext image
                echo "==> Downloading sysext image kubernetes-${KUBE_VERSION}-${ARCH}.raw ..."
                curl -fsSL -o "/tmp/kubernetes-${KUBE_VERSION}-${ARCH}.raw" \
                    "${BASE_URL}/kubernetes-${KUBE_VERSION}-${ARCH}.raw"

                # Repackage with ID=_any for Ubuntu compatibility
                echo "==> Repackaging sysext image for Ubuntu compatibility..."
                TMPDIR=$(mktemp -d)
                unsquashfs -d "${TMPDIR}/extract" "/tmp/kubernetes-${KUBE_VERSION}-${ARCH}.raw"

                RELEASE_DIR="${TMPDIR}/extract/usr/lib/extension-release.d"
                mkdir -p "${RELEASE_DIR}"
                rm -f "${RELEASE_DIR}"/extension-release.*
                echo "ID=_any" > "${RELEASE_DIR}/extension-release.kubernetes"

                mksquashfs "${TMPDIR}/extract" \
                    "/opt/extensions/kubernetes/kubernetes-${KUBE_VERSION}-${ARCH}.raw" \
                    -noappend -quiet
                rm -rf "${TMPDIR}" "/tmp/kubernetes-${KUBE_VERSION}-${ARCH}.raw"

                # Create symlink for systemd-sysext
                ln -sf "/opt/extensions/kubernetes/kubernetes-${KUBE_VERSION}-${ARCH}.raw" \
                    /etc/extensions/kubernetes.raw

                # Download sysupdate configs for future patch-level updates
                echo "==> Downloading sysupdate configs..."
                curl -fsSL -o "/etc/sysupdate.kubernetes.d/kubernetes-${KUBE_MAJOR_MINOR}.conf" \
                    "${BASE_URL}/kubernetes-${KUBE_MAJOR_MINOR}.conf" || true
                curl -fsSL -o /etc/sysupdate.d/noop.conf \
                    "https://extensions.flatcar.org/extensions/noop.conf" || true

                # Activate the sysext overlay
                echo "==> Activating sysext overlay..."
                systemd-sysext refresh

                # Reload systemd and enable kubelet (containerd already running)
                systemctl daemon-reload
                systemctl enable kubelet

                echo "==> Kubernetes ${KUBE_VERSION} sysext setup complete."
      - op: add
        path: /spec/template/spec/preKubeadmCommands
        valueFrom:
          template: |
            - KUBERNETES_VERSION={{ .builtin.machineDeployment.version }} /opt/sysext/install-k8s-sysext.sh
