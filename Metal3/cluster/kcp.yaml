apiVersion: controlplane.cluster.x-k8s.io/v1beta2
kind: KubeadmControlPlane
metadata:
  name: kubevirt-test-1
  namespace: default
spec:
  machineTemplate:
    spec:
      infrastructureRef:
        apiGroup: infrastructure.cluster.x-k8s.io
        kind: Metal3MachineTemplate
        name: kubevirt-test-1-controlplane
  replicas: 1
  rollout:
    strategy:
      rollingUpdate:
        maxSurge: 1
      type: RollingUpdate
  version: v1.35.0
  kubeadmConfigSpec:
    files:
    - contentFrom:
        secret:
          key: ubuntu-install-k8s-release-artifacts.sh
          name: install-k8s
      path: /usr/local/bin/install-k8s.sh
      owner: root:root
      permissions: '0755'
    # kube-vip static pod (ARP mode) providing the control-plane VIP on the
    # "baremetal-net" bridge network (see ../kubevirt-baremetal-network.yaml
    # and metal3cluster.yaml). vip_interface is a placeholder substituted at
    # boot by preKubeadmCommands below, since the guest's predictable
    # interface name for the second NIC can't be assumed (q35 PCI slot
    # ordering isn't simply sequential across interfaces) -- it's detected
    # by MAC address instead.
    - content: |
        apiVersion: v1
        kind: Pod
        metadata:
          name: kube-vip
          namespace: kube-system
        spec:
          containers:
          - args:
            - manager
            env:
            - name: vip_arp
              value: "true"
            - name: port
              value: "6443"
            - name: vip_nodename
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: vip_interface
              value: __VIP_IFACE__
            - name: vip_subnet
              value: "32"
            - name: dns_mode
              value: first
            - name: cp_enable
              value: "true"
            - name: cp_namespace
              value: kube-system
            - name: vip_leaderelection
              value: "true"
            - name: vip_leasename
              value: plndr-cp-lock
            - name: vip_leaseduration
              value: "5"
            - name: vip_renewdeadline
              value: "3"
            - name: vip_retryperiod
              value: "1"
            - name: address
              value: "192.168.100.100"
            - name: prometheus_server
              value: :2112
            image: ghcr.io/kube-vip/kube-vip:v1.0.0
            imagePullPolicy: IfNotPresent
            name: kube-vip
            securityContext:
              capabilities:
                add:
                - NET_ADMIN
                - NET_RAW
                drop:
                - ALL
            volumeMounts:
            - mountPath: /etc/kubernetes/admin.conf
              name: kubeconfig
          hostAliases:
          - hostnames:
            - kubernetes
            ip: 127.0.0.1
          hostNetwork: true
          volumes:
          - hostPath:
              path: /etc/kubernetes/admin.conf
            name: kubeconfig
      path: /etc/kubernetes/manifests/kube-vip.yaml
      owner: root:root
      permissions: '0644'
    # cloud-init/netplan's fallback network generator only configures the
    # *first* detected NIC (eth0/enp1s0, the pod network) with DHCP; the
    # second NIC (baremetal-net) is left administratively down with no
    # netplan config at all. This placeholder is patched with the real
    # interface name (resolved by MAC, same as __VIP_IFACE__ below) by
    # preKubeadmCommands, *before* kubeadm init runs. This matters a lot
    # more than "just" pod<->VM connectivity: kubeadm's ClusterConfiguration
    # uses controlPlaneEndpoint (the kube-vip VIP) for its own internal
    # bootstrap calls (e.g. the upload-config/kubeadm phase that creates the
    # admin.conf RBAC bootstrapping). If the interface is still down when
    # kubeadm init starts, kube-vip can never ARP-announce the VIP, those
    # internal calls time out, and kubeadm init fails/continues in a broken
    # state (missing default RBAC ClusterRoleBindings) even though the
    # control-plane static pods look healthy.
    - content: |
        network:
          version: 2
          ethernets:
            __BM_IFACE__:
              dhcp4: true
              dhcp4-overrides:
                use-routes: false
              optional: true
      path: /etc/netplan/91-baremetal-net.yaml
      owner: root:root
      permissions: '0600'
    preKubeadmCommands:
    - /usr/local/bin/install-k8s.sh
    # Resolve the baremetal-net NIC by MAC (see create-bmhs.sh,
    # BM_MAC_ADDRESS uses the 52:54:00:10:00:xx prefix), patch it into the
    # kube-vip manifest above and the netplan file above, bring the link up,
    # and wait (up to 30s) for a DHCP lease from KubeVirt's internal DHCP
    # responder on baremetal-net -- all *before* kubeadm init, so kube-vip
    # can claim the VIP as soon as its static pod starts (see the netplan
    # file comment above for why this matters beyond simple connectivity).
    - >-
      BM_IFACE=$(ip -o link show | grep -i "52:54:00:10:00" | awk -F': ' '{print $2}' | cut -d@ -f1) &&
      sed -i "s/__VIP_IFACE__/${BM_IFACE}/" /etc/kubernetes/manifests/kube-vip.yaml &&
      sed -i "s/__BM_IFACE__/${BM_IFACE}/" /etc/netplan/91-baremetal-net.yaml &&
      ip link set dev "${BM_IFACE}" up &&
      netplan apply &&
      for i in $(seq 1 30); do ip -o addr show dev "${BM_IFACE}" | grep -q "inet " && break; sleep 1; done
    # See https://github.com/kube-vip/kube-vip/issues/684 -- kubeadm init
    # needs super-admin.conf, kube-vip's static-pod manifest expects
    # admin.conf; reverted by postKubeadmCommands once admin.conf exists.
    - "sed -i 's#path: /etc/kubernetes/admin.conf#path: /etc/kubernetes/super-admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml"
    postKubeadmCommands:
    - "sed -i 's#path: /etc/kubernetes/super-admin.conf#path: /etc/kubernetes/admin.conf#' /etc/kubernetes/manifests/kube-vip.yaml"
    joinConfiguration:
      controlPlane: {}
      nodeRegistration:
        name: '{{ ds.meta_data.name }}'
        kubeletExtraArgs:
        - name: node-labels
          value: 'metal3.io/uuid={{ ds.meta_data.uuid }}'
    initConfiguration:
      nodeRegistration:
        name: '{{ ds.meta_data.name }}'
        kubeletExtraArgs:
        - name: node-labels
          value: 'metal3.io/uuid={{ ds.meta_data.uuid }}'
    users:
    - name: ubuntu
      sudo: 'ALL=(ALL) NOPASSWD:ALL'
      sshAuthorizedKeys:
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOxg0/L9LWM8K6//pe5OYc7SK4vv6676uz6VRJGA44nl lennart
      - ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIDD8VQjOYqKP/OSkvGquFjaUwaiAtKYKVv5l7ThGGuYg ubuntu@lennart-capo-upgrade
