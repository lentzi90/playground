apiVersion: infrastructure.cluster.x-k8s.io/v1beta1
kind: Metal3Cluster
metadata:
  name: kubevirt-test-1
  namespace: default
spec:
  # kube-vip (ARP mode) hosts this VIP on the "baremetal-net" bridge network
  # (see ../kubevirt-baremetal-network.yaml) -- a real L2 segment, not the
  # default pod network. This replaces the old cp-endpoint-service.yaml
  # hack (a Service pinned to a specific VM name), so the endpoint now
  # survives node replacement / rolling upgrades: the VIP follows whichever
  # VM currently holds the KubeadmControlPlane leader lease, via genuine
  # gratuitous-ARP failover. See kcp.yaml for the kube-vip static pod.
  controlPlaneEndpoint:
    host: 192.168.100.100
    port: 6443
  noCloudProvider: true
