---
# ClusterResourceSet that applies Calico CNI to any cluster labeled cni=calico.
# The actual Calico manifest lives in the calico-cni ConfigMap, generated by
# this directory's kustomization.yaml's configMapGenerator from the
# pre-rendered ./calico.yaml (see ./calico/kustomization.yaml for how that's
# derived from the shared ../../ClusterResourceSets/calico base).
#
# Applied independently from Metal3/cluster (see Metal3/README.md), mirroring
# how ../../ClusterResourceSets is kept separate from the CAPO cluster
# manifests.
apiVersion: addons.cluster.x-k8s.io/v1beta2
kind: ClusterResourceSet
metadata:
  name: calico-cni
  namespace: default
spec:
  clusterSelector:
    matchLabels:
      cni: calico
  strategy: ApplyOnce
  resources:
  - name: calico-cni
    kind: ConfigMap
