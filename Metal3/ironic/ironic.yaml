apiVersion: ironic.metal3.io/v1alpha1
kind: Ironic
metadata:
  name: ironic
  namespace: baremetal-operator-system
spec:
  # No DHCP needed — KubeVirt VMs get IPs from the masquerade network.
  # No keepalived needed — we rely on the auto-detected hostIP.
  # No explicit ipAddress or interface — IRSO will use status.hostIP.
  networking: {}
  tls:
    certificateName: ironic-cert
  deployRamdisk:
    sshKey: "ssh-ed25519 AAAAC3NzaC1lZDI1NTE5AAAAIOxg0/L9LWM8K6//pe5OYc7SK4vv6676uz6VRJGA44nl lennart.jern@est.tech"
    extraKernelParams: "console=ttyS0"
